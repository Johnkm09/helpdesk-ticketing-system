[project]
name = "helpdesk-ticketing-system"
version = "0.1.0"
description = "Helpdesk Ticketing System REST API built with Django REST Framework"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes errors
    "I",   # Import sorting
    "B",   # Likely bugs
    "UP",  # Python modernization
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]